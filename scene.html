<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guess Moby's Game — 8s spot</title>
<style>
  /* Tokens lifted from gmg/colors_and_type.css (mode-1) + kit.css. */
  @font-face { font-family: "Fugaz One"; src: url("assets/fonts/FugazOne-Regular.ttf") format("truetype"); }
  @font-face { font-family: "Work Sans"; src: url("assets/fonts/WorkSans-VariableFont_wght.ttf") format("truetype"); font-weight: 100 900; }
  :root {
    --accent: rgb(255, 174, 23);
    --accent-secondary: rgb(160, 110, 17);
    --base: rgb(0, 116, 200);
    --base-secondary: rgb(0, 91, 111);
    --ink-dark: rgb(0, 91, 111);
    --text: #fff;
    --font-display: "Fugaz One", sans-serif;
    --font-ui: "Work Sans", sans-serif;
    --kb-tray-bg: color-mix(in srgb, var(--base-secondary) 32%, var(--base));
    --kb-mod-bg: color-mix(in srgb, var(--base-secondary) 70%, var(--base));
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1500px; height: 1000px; overflow: hidden; background: var(--base); font-family: var(--font-ui); }
  .abs { position: absolute; }
  .layer { position: absolute; inset: 0; }
  #bg { width: 1500px; height: 1000px; display: block; }

  /* ---- Moby ---------------------------------------------------- */
  #glow { left: 690px; top: 40px; width: 820px; height: 820px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,214,110,.95) 0%, rgba(255,174,23,.55) 32%, rgba(255,174,23,0) 68%); opacity: 0; }
  #rays { left: 600px; top: -50px; width: 1000px; height: 1000px; border-radius: 50%; opacity: 0;
    background: repeating-conic-gradient(rgba(255,230,160,.55) 0 9deg, rgba(255,230,160,0) 9deg 22.5deg);
    -webkit-mask: radial-gradient(circle, #000 18%, transparent 66%); mask: radial-gradient(circle, #000 18%, transparent 66%); }
  #moby { left: 800px; top: 90px; width: 648px; height: 864px; transform-origin: 50% 90%; }
  #moby img { width: 648px; height: 864px; display: block; }

  /* ---- Guess bubble (kit .kb-field / .kb-bar, drawn at 2x) ------ */
  .kb-field {
    display: flex; align-items: center; gap: 2px;
    height: 100px; padding: 0 28px;
    background: #fff; border: 4px solid var(--base-secondary); border-radius: 24px;
    box-shadow: 0 8px 0 0 var(--base-secondary);
    font: 700 38px/1.3 var(--font-ui); color: var(--ink-dark); white-space: pre;
  }
  .kb-field.is-open { outline: 6px solid var(--accent); outline-offset: 4px; }
  .kb-ph { color: color-mix(in srgb, var(--ink-dark) 45%, transparent); font-weight: 600; }
  .kb-caret { width: 4px; height: 1.15em; border-radius: 2px; background: currentColor; flex: none; }

  #think { left: 70px; top: 90px; transform-origin: 92% 100%; }
  #thinkField { height: auto; padding: 18px 36px 20px; font-size: 56px; line-height: 1.22; border-radius: 28px; align-items: flex-end; }
  #thinkField .kb-caret { margin-bottom: 0.12em; }
  .puff { position: absolute; background: #fff; border: 4px solid var(--base-secondary); border-radius: 50%; box-shadow: 0 5px 0 0 var(--base-secondary); }

  /* Clue chips (.kb-chip, 2x) with the yellow clue-number badge */
  .chip { display: inline-flex; align-items: center; gap: 18px; padding: 12px 34px 12px 12px;
    border-radius: 9999px; border: 4px solid var(--base-secondary); background: #fff; color: var(--ink-dark);
    box-shadow: 0 5px 0 var(--base-secondary); font: 700 46px/1 var(--font-ui); white-space: nowrap; transform-origin: 20% 50%; }
  .badge { width: 70px; height: 70px; border-radius: 50%; background: var(--accent); border: 4px solid var(--base-secondary);
    display: grid; place-items: center; font: 400 38px/1 var(--font-display); color: #fff;
    -webkit-text-stroke: 5px var(--base-secondary); paint-order: stroke fill; flex: none; }

  /* Display type (.dt / .display) — Fugaz One + stroke + hard shadow */
  .dt { font-family: var(--font-display); color: #fff; line-height: 1; white-space: nowrap;
    -webkit-text-stroke: 12px var(--base-secondary); paint-order: stroke fill; text-shadow: 0 12px 0 var(--base-secondary); }
  .dt.y { color: var(--accent); }

  #wait  { left: 80px; top: 120px; font-size: 128px; transform-origin: 30% 70%; }
  #gotit { left: 70px; top: 268px; font-size: 136px; transform-origin: 40% 70%; }

  #answer { left: 80px; top: 500px; display: flex; gap: 16px; align-items: stretch; }
  #answer .kb-field { width: 610px; }
  .btn { border: 4px solid var(--base-secondary); border-radius: 24px; font: 800 36px/1 var(--font-ui);
    padding: 0 34px; display: grid; place-items: center; background: var(--accent); color: var(--base-secondary);
    box-shadow: 0 12px 1px 0 var(--base-secondary); }
  #correct { left: 80px; top: 650px; transform-origin: 10% 50%; display: inline-flex; align-items: center; gap: 16px;
    padding: 14px 30px 14px 14px; border-radius: 9999px; background: var(--accent); border: 4px solid var(--base-secondary);
    box-shadow: 0 8px 0 var(--base-secondary); font: 800 34px/1 var(--font-ui); color: var(--base-secondary); }
  #correct .tick { width: 56px; height: 56px; border-radius: 50%; background: #fff; border: 4px solid var(--base-secondary); display: grid; place-items: center; }
  .confetti { position: absolute; width: 18px; height: 26px; border: 3px solid var(--base-secondary); border-radius: 4px; }

  #flash { background: #fff; opacity: 0; }

  /* ---- Scene C: game interface ---------------------------------- */
  #logo { left: 390px; top: 150px; width: 720px; transform-origin: 50% 60%; }
  #tag { left: 0; top: 720px; width: 1500px; display: flex; justify-content: center; gap: 0 22px; }
  #tag span { font: 800 64px/1.2 var(--font-ui); color: #fff; text-shadow: 0 6px 0 var(--base-secondary); display: inline-block; }
  #tag span.y { color: var(--accent); font: 400 70px/1.2 var(--font-display); -webkit-text-stroke: 10px var(--base-secondary); paint-order: stroke fill; text-shadow: 0 8px 0 var(--base-secondary); }
</style>
</head>
<body>
<div id="stage">
  <img id="bg" class="abs" alt="">

  <!-- Scenes A + B: Moby thinking → realization -->
  <div id="sceneAB" class="layer">
    <div id="rays" class="abs"></div>
    <div id="glow" class="abs"></div>
    <div id="moby" class="abs"><img id="mobyImg" alt=""></div>

    <div id="think" class="abs">
      <div class="kb-field" id="thinkField"><span id="thinkText"></span><span class="kb-caret" id="thinkCaret"></span></div>
      <div class="puff" id="p1" style="right:-40px; bottom:-26px; width:40px; height:40px"></div>
      <div class="puff" id="p2" style="right:-78px; bottom:-56px; width:26px; height:26px"></div>
    </div>

    <div id="chip1" class="abs chip" style="left:80px; top:350px"><span class="badge">1</span>Specific frame…</div>
    <div id="chip2" class="abs chip" style="left:220px; top:490px"><span class="badge">2</span>Released in…</div>
    <div id="chip3" class="abs chip" style="left:100px; top:630px"><span class="badge">3</span>That iconic detail…</div>

    <div id="wait" class="abs dt">WAIT…</div>
    <div id="gotit" class="abs dt y">I GUESS IT!</div>

    <div id="answer" class="abs">
      <div class="kb-field" id="ansField"><span id="ansText"></span><span class="kb-caret" id="ansCaret"></span><span class="kb-ph" id="ansPh">Type your guess…</span></div>
      <div class="btn" id="ansBtn">Guess</div>
    </div>
    <div id="correct" class="abs">
      <span class="tick"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="rgb(0,91,111)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
      Got it on clue 1 · Pixel Perfect!
    </div>
    <div id="confetti" class="layer"></div>
  </div>

  <!-- Scene C: challenge end card -->
  <div id="sceneC" class="layer">
    <img id="logo" class="abs" src="assets/logo-moby.png" alt="Guess Moby's Game">
    <div id="tag" class="abs"><span id="t1">4 clues.</span><span id="t2">1 game.</span><span id="t3" class="y">Can you get it?</span></div>
  </div>

  <div id="flash" class="layer"></div>
</div>

<script>
// ===== Content (swap the answer here) =====
const THINK_LINE = 'Hmm…\nwhat game was that?';
const ANSWER = 'Adventure';

// ===== Timing helpers =====
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = k => 1 - Math.pow(1 - k, 3);
const easeIn = k => k * k * k;
const easeInOut = k => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const back = k => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); };
// damped spring 0→1 (overshoots, settles)
const spring = (k, f = 3.2, d = 5.5) => (k <= 0 ? 0 : k >= 1.6 ? 1 : 1 - Math.exp(-d * k) * Math.cos(f * Math.PI * k));
// keyframe track: [[t, v], ...] with easeInOut between keys
function track(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    if (t <= keys[i][0]) return lerp(keys[i - 1][1], keys[i][1], easeInOut(prog(t, keys[i - 1][0], keys[i][0])));
  }
  return keys[keys.length - 1][1];
}
const $ = id => document.getElementById(id);
const set = (el, o, tf) => { el.style.opacity = o; el.style.transform = tf || 'none'; el.style.visibility = o <= 0.001 ? 'hidden' : 'visible'; };
// pop in at a (springy scale), pop out at b
function pop(el, t, a, b = 99, extra = '') {
  const kin = prog(t, a, a + 0.5), kout = prog(t, b, b + 0.16);
  const s = spring(kin) * (1 - easeIn(kout)) ;
  const o = clamp(kin * 4) * (1 - kout);
  set(el, o, `${extra} scale(${Math.max(0, s)})`);
}

// ===== Moby clip retime =====
// Source is ~24.1fps, 121 frames. The thinking beat (0.3–4.0s) is stretched
// over 0–3.9s, then the blink + "lights up" beat (4.0–5.02s) plays through.
const CLIP_FPS = 24.1, CLIP_N = 121;
function clipTime(t) {
  if (t < 3.9) return 0.3 + t * (3.7 / 3.9);
  return Math.min(4.0 + (t - 3.9), 5.0);
}
const clipFrame = t => Math.min(CLIP_N, Math.floor(clipTime(t) * CLIP_FPS) + 1);
const pad = n => String(n).padStart(4, '0');

// ===== Frame renderer =====
const DUR = 10, FPS = 60;
const mobyCache = {};
async function preloadMoby() {
  // Decode sequentially — many parallel decodes can fail in headless Chromium.
  for (let i = 1; i <= CLIP_N; i++) {
    const im = new Image(); im.src = `build/moby/${pad(i)}.png`; mobyCache[i] = im;
    await im.decode();
  }
}

const CONF = Array.from({ length: 34 }, (_, i) => {
  let s = i * 9301 + 49297; const r = () => ((s = (s * 233280 + 12345) % 1e9) / 1e9);
  return { a: r() * Math.PI * 2, v: 380 + r() * 520, rot: r() * 720 - 360, col: ['rgb(255,174,23)', '#fff', 'rgb(0,116,200)', 'rgb(255,214,110)'][i % 4], sx: 0.7 + r() * 0.6 };
});
function buildConfetti() {
  for (let i = 0; i < CONF.length; i++) {
    const d = document.createElement('div'); d.className = 'confetti'; d.style.background = CONF[i].col; $('confetti').appendChild(d); CONF[i].el = d;
  }
}

async function renderAt(t) {
  // Background loop (60fps, 480 frames) — wraps after 8s
  const bf = (Math.floor(t * 60) % 480) + 1;
  const bg = $('bg'); const src = `build/bg/${pad(bf)}.jpg`;
  if (!bg.src.endsWith(src)) { bg.src = src; await bg.decode(); }

  const inC = t >= 7.0;
  $('sceneAB').style.display = inC ? 'none' : 'block';
  $('sceneC').style.display = inC ? 'block' : 'none';

  // Cut flash at 7.0
  $('flash').style.opacity = t >= 6.93 && t < 7.2 ? (t < 7 ? prog(t, 6.93, 7) : 1 - prog(t, 7, 7.2)) * 0.9 : 0;

  if (!inC) renderAB(t); else renderC(t);
}

function renderAB(t) {
  const r = t - 2;   // realization/answer beats were authored at 2–5s; they now play at 4–7s
  // ---- Moby ----
  $('mobyImg').src = mobyCache[clipFrame(t)].src;
  const enter = easeOut(prog(t, 0, 0.45));
  const lit = spring(prog(r, 2.35, 2.95));        // body "lights up" bounce
  const bob = r > 2.95 ? Math.sin((r - 2.95) * 5.2) * 8 : 0;
  const sc = lerp(0.94, 1, enter) * (1 + 0.07 * Math.sin(Math.PI * clamp(prog(r, 2.35, 2.75))));
  const tilt = r > 2.95 ? Math.sin((r - 2.95) * 5.2) * 1.6 : 0;
  set($('moby'), 1, `translate(${lerp(90, 0, enter)}px, ${bob}px) scale(${sc}) rotate(${tilt}deg)`);

  // glow + rays for the realization
  const g = easeOut(prog(r, 2.3, 2.6)) * (1 - 0.25 * (0.5 + 0.5 * Math.sin(t * 7)) * prog(r, 2.6, 3));
  set($('glow'), g, `scale(${lerp(0.4, 1, easeOut(prog(r, 2.3, 2.7)))})`);
  set($('rays'), 0.9 * easeOut(prog(r, 2.3, 2.7)), `rotate(${t * 22}deg) scale(${lerp(0.5, 1, easeOut(prog(r, 2.3, 2.7)))})`);

  // ---- Thought bubble: "Hmm… what game was that?" ----
  const thinkIn = prog(t, 0.2, 0.75), thinkOut = prog(t, 3.9, 4.06);
  const ts = spring(thinkIn) * (1 - easeIn(thinkOut));
  set($('think'), clamp(thinkIn * 4) * (1 - thinkOut), `translateY(${Math.sin(t * 3) * 4}px) scale(${ts})`);
  const n = Math.round(THINK_LINE.length * prog(t, 0.55, 2.1));
  $('thinkText').textContent = THINK_LINE.slice(0, n);
  $('thinkCaret').style.opacity = (n < THINK_LINE.length || Math.floor(t * 2) % 2 === 0) ? 1 : 0;
  $('p1').style.opacity = clamp(prog(t, 0.55, 0.7)); $('p2').style.opacity = clamp(prog(t, 0.7, 0.85));

  // ---- Clue chips flash in, float, then scatter at the realization ----
  [['chip1', 1.5], ['chip2', 2.15], ['chip3', 2.8]].forEach(([id, a], i) => {
    const el = $(id);
    const fl = Math.sin(t * 3.4 + i * 2) * 6;
    const out = prog(t, 3.92 + i * 0.03, 4.12 + i * 0.03);
    const kin = prog(t, a, a + 0.5);
    const s = spring(kin);
    const flick = kin > 0 && kin < 0.2 ? 1.25 : 1;   // quick "flash" on arrival
    el.style.filter = `brightness(${flick})`;
    set(el, clamp(kin * 5) * (1 - out), `translate(${-easeIn(out) * 240}px, ${fl - easeIn(out) * 60 * (i - 1)}px) rotate(${(1 - s) * -8 + (i - 1) * 1.5}deg) scale(${Math.max(0, s) * (1 - 0.4 * out)})`);
  });

  // ---- "WAIT… I GUESS IT!" ----
  const shake = (a) => (r > a && r < a + 0.3 ? Math.sin((r - a) * 90) * 10 * (1 - prog(r, a, a + 0.3)) : 0);
  pop($('wait'), r, 2.08, 99, `translateX(${shake(2.08)}px) rotate(-4deg)`);
  pop($('gotit'), r, 2.4, 99, `translateX(${shake(2.4)}px) rotate(-3deg)`);

  // ---- Answer reveal in the guess bar ----
  const barIn = easeOut(prog(r, 3.0, 3.3));
  set($('answer'), barIn, `translateY(${lerp(60, 0, barIn)}px)`);
  const an = Math.round(ANSWER.length * prog(r, 3.3, 3.95));
  $('ansText').textContent = ANSWER.slice(0, an);
  $('ansPh').style.display = an ? 'none' : 'inline';
  $('ansCaret').style.opacity = r < 4.05 && (an < ANSWER.length || Math.floor(t * 3) % 2 === 0) ? 1 : 0;
  $('ansField').classList.toggle('is-open', r < 4.05);
  const press = r >= 4.02 && r < 4.14;
  $('ansBtn').style.transform = press ? 'translateY(10px)' : 'none';
  $('ansBtn').style.boxShadow = press ? '0 0 0 0 var(--base-secondary)' : '';
  // solved: the field pulses
  const solved = prog(r, 4.12, 4.5);
  $('ansField').style.borderColor = r >= 4.12 ? 'rgb(255,174,23)' : '';
  $('ansField').style.transform = r >= 4.12 ? `scale(${1 + 0.05 * Math.sin(Math.PI * solved)})` : 'none';
  pop($('correct'), r, 4.16, 99, 'rotate(-2deg)');

  // confetti burst from the Guess button
  const ck = prog(r, 4.12, 5.0);
  CONF.forEach(c => {
    const dx = Math.cos(c.a) * c.v * easeOut(ck), dy = Math.sin(c.a) * c.v * easeOut(ck) + 520 * ck * ck;
    set(c.el, ck > 0 ? 1 - prog(r, 4.7, 5.0) : 0, `translate(${860 + dx}px, ${550 + dy}px) rotate(${c.rot * ck}deg) scaleX(${c.sx})`);
  });
}

function renderC(t) {
  pop($('logo'), t, 7.1);
  ['t1', 't2', 't3'].forEach((id, i) => {
    const k = easeOut(prog(t, 7.75 + i * 0.3, 8.05 + i * 0.3));
    set($(id), k, `translateY(${lerp(40, 0, k)}px) scale(${lerp(0.8, 1, back(k))})`);
  });
  // logo floats gently once it has landed (README wobble, scaled down)
  if (t > 7.7) {
    const lp = ((t - 7.7) % 2) / 2;
    const rot = track(lp, [[0, 0], [0.175, -2], [0.425, 1.6], [0.675, -1.2], [1, 0]]);
    const my = track(lp, [[0, 0], [0.25, -8], [0.5, 2], [0.75, -5], [1, 0]]);
    $('logo').style.transform = `translateY(${my}px) rotate(${rot}deg)`;
  }
}

window.DUR = DUR; window.FPS = FPS; window.renderAt = renderAt;
window.ready = (async () => {
  buildConfetti();
  await document.fonts.load('40px "Fugaz One"'); await document.fonts.load('700 40px "Work Sans"'); await document.fonts.load('800 40px "Work Sans"');
  await preloadMoby();
  await renderAt(0);
  return true;
})();
</script>
</body>
</html>
